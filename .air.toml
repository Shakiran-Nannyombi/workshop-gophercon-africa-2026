# Live reload for Karibu Guide: make dev
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go tool templ generate ./internal/views/... && go build -o ./tmp/karibu ./cmd/web"
  entrypoint = ["./tmp/karibu", "-dev"]
  include_ext = ["go", "templ", "json"]
  include_dir = ["cmd", "internal", "data", "static"]
  exclude_regex = ["_templ\\.go$", "_test\\.go$"]
  exclude_dir = ["tmp", "vendor", "web", "static/fonts"]
  delay = 300
  stop_on_error = true

[proxy]
  enabled = true
  proxy_port = 8090
  app_port = 8080

[misc]
  clean_on_exit = true
